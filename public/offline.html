<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3154d6" />
    <title>オフライン | ハチワレ手帳</title>
    <link rel="icon" href="./icon-192.png" />
    <style>
      :root { color-scheme: light; font-family: Meiryo, "メイリオ", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; background: #f6f4fb; color: #29283a; }
      main { width: min(560px, 100%); padding: clamp(30px, 8vw, 64px); border: 1px solid #c9c3da; background: #fcfbff; }
      img { width: 72px; height: 72px; border-radius: 20px; }
      p { margin: 18px 0 0; color: #77738b; font-size: 13px; line-height: 1.9; }
      h1 { margin: 22px 0 0; font-size: clamp(30px, 8vw, 48px); line-height: 1.25; }
      a { display: inline-flex; min-height: 46px; align-items: center; margin-top: 28px; padding: 0 18px; background: #3154d6; color: #fff; font-size: 12px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="./icon-192.png" alt="" />
      <h1>通信を確認してください。</h1>
      <p>
        開いたことのないページは、インターネット接続後に読み込んでください。
        すでに保存された記録は端末内にあります。
      </p>
      <a href="./">もう一度開く</a>
    </main>
  </body>
</html>
